const hex = h => new Uint8Array(h.match(/../g).map(x => parseInt(x, 16)));
async function oeffnen(roh){
  const k = await crypto.subtle.importKey("raw", roh, "AES-GCM", false, ["decrypt"]);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:b(IV)}, k, b(DATEN)));
  document.open(); document.write(html); document.close();
}
async function ableiten(pw){
  const basis = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", hash:"SHA-256", salt:hex(SALZ), iterations:300000}, basis, 256));
}

  tor.addEventListener("submit", async e=>{
    e.preventDefault(); const f = document.getElementById("f"); f.textContent = "Wird geöffnet …";

    try {
      await oeffnen(roh);
      if (merken) try { localStorage.setItem(LS, btoa(String.fromCharCode(...roh))); } catch(e) {}

  });
})();
