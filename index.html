<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Be Naturals">
<meta name="theme-color" content="#FAF7F2">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Be Naturals Cockpit</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#FAF7F2;font-family:Inter,system-ui,-apple-system,sans-serif;color:#4D4D4D;padding:16px;box-sizing:border-box}
form{background:#fff;border:1px solid #ECECEC;border-radius:14px;padding:28px 24px;width:100%;max-width:340px}
h1{margin:0 0 4px;font-size:22px;color:#121212;font-weight:600}h1 span{color:#8A6233}
p{margin:0 0 18px;font-size:14px}
input[type=password]{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:11px 12px;border:1px solid #D9D2C6;border-radius:9px;background:#FAF7F2}
label.m{display:flex;gap:8px;align-items:center;font-size:14px;margin:12px 0 16px}
button{width:100%;font:inherit;font-weight:600;padding:11px;border:0;border-radius:9px;background:#8A6233;color:#fff;cursor:pointer}
#f{color:#B3261E;font-size:13.5px;min-height:18px;margin:10px 0 0}
</style>
</head>
<body>
<form id="tor" hidden>
  <h1><span>be naturals</span> · Cockpit</h1>
  <p>Bitte Passwort eingeben.</p>
  <input type="password" id="pw" autocomplete="current-password" aria-label="Passwort" autofocus>
  <label class="m"><input type="checkbox" id="merken" checked> Auf diesem Gerät merken</label>
  <button>Öffnen</button>
  <p id="f" role="status"></p>
</form>
<script>
(()=>{
const SALZ="3fa3040250dca738d32f164f7cd6f423", LS="bn-schluessel", LD="bn-daten";
let IV="", DATEN="";
// Immer frisch vom Server holen (Zeitstempel umgeht jeden Cache); ohne Netz den letzten Stand vom Gerät nehmen
async function laden(){
  try {
    const r = await fetch("daten.json?t="+Date.now(), {cache:"no-store"});
    if (!r.ok) throw 0;
    const d = await r.json(); IV=d.iv; DATEN=d.daten;
    try { localStorage.setItem(LD, JSON.stringify(d)); } catch(e) {}
  } catch(e) {
    try { const d = JSON.parse(localStorage.getItem(LD)||"null"); if (d) { IV=d.iv; DATEN=d.daten; } } catch(_) {}
  }
}
const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hex = h => new Uint8Array(h.match(/../g).map(x => parseInt(x, 16)));
async function oeffnen(roh){
  const k = await crypto.subtle.importKey("raw", roh, "AES-GCM", false, ["decrypt"]);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:b(IV)}, k, b(DATEN)));
  document.open(); document.write(html); document.close();
}
async function ableiten(pw){
  const basis = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", hash:"SHA-256", salt:hex(SALZ), iterations:300000}, basis, 256));
}
(async ()=>{
  await laden();
  let gemerkt = null; try { gemerkt = localStorage.getItem(LS); } catch(e) {}
  if (gemerkt) { try { await oeffnen(b(gemerkt)); return; } catch(e) { try { localStorage.removeItem(LS); } catch(_) {} } }
  const tor = document.getElementById("tor"); tor.hidden = false;
  tor.addEventListener("submit", async e=>{
    e.preventDefault(); const f = document.getElementById("f"); f.textContent = "Wird geöffnet …";
    const roh = await ableiten(document.getElementById("pw").value);
    const merken = document.getElementById("merken").checked;
    try {
      await oeffnen(roh);
      if (merken) try { localStorage.setItem(LS, btoa(String.fromCharCode(...roh))); } catch(e) {}
    } catch(err) { f.textContent = "Passwort stimmt nicht."; }
  });
})();
})();
</script>
</body>
</html>
